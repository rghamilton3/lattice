[project]
name = "asr-shim"
version = "0.1.1"
description = "OpenAI-compatible audio transcription shim for Lattice: ffmpeg normalization + NeMo Parakeet ASR behind llama-swap"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Real ASR backend; never installed in CI (tests use FakeTranscriber).
nemo = ["nemo_toolkit[asr]>=2.7,<3"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asr_shim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
