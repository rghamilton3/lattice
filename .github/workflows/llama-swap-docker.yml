name: Build and push llama-swap Docker image

on:
  push:
    branches: [main]
    tags: ['llama-swap-v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/lattice-llama-swap

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # build/push needs read; the release step needs write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=match,pattern=llama-swap-v(.*),group=1
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/llama-swap-v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./asr-shim/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          provenance: false

      # On a llama-swap-v* tag, attach the EXTERNAL config + fetch helper to the
      # release so a deployment can pull versioned copies (no repo clone). The
      # image tag and these assets share the version. Raw curl from the tag also
      # works without this step.
      - name: Attach config + fetch helper to the release
        if: startsWith(github.ref, 'refs/tags/llama-swap-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            scripts/llama-swap.config.yaml scripts/fetch-models.sh \
            --title "$GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" \
            scripts/llama-swap.config.yaml scripts/fetch-models.sh --clobber
