name: Attach llama-swap config to release

on:
  push:
    tags: ['llama-swap-config-v*']
  workflow_dispatch:

jobs:
  attach-config:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate ref is a versioned tag
        run: |
          [[ "$GITHUB_REF_NAME" == llama-swap-config-v* ]] \
            || { echo "workflow_dispatch only — '$GITHUB_REF_NAME' is not a versioned tag, skipping"; exit 0; }

      - name: Attach config + fetch helper to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            scripts/llama-swap.config.yaml scripts/fetch-models.sh \
            --title "$GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" \
            scripts/llama-swap.config.yaml scripts/fetch-models.sh --clobber
